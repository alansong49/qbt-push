<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>种子推送 · QBT下载</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="header">
    <h1 class="title">种子推送</h1>
    <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main class="main">
    <section class="card submit-card">
      <label class="input-label" for="linkInput">磁力链接 / 种子 URL</label>
      <textarea id="linkInput" class="link-input" rows="3"
        placeholder="粘贴磁力链接 (magnet:?xt=...) 或 .torrent 文件直链地址，支持多行批量推送"></textarea>
      <button id="submitBtn" class="submit-btn" disabled>
        <span class="btn-text">推送到 QBT 下载</span>
        <span class="btn-spinner" hidden></span>
      </button>
    </section>

    <!-- 快捷找资源 -->
    <section class="card quick-search-card">
      <label class="input-label" for="searchInput">快捷找资源：输入片名/关键词，下方站点按钮一键直达搜索结果</label>
      <div class="quick-search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="如：Spider-Man 2026（建议用英文片名或 IMDb 编号）">
        <button id="clearSearchBtn" class="btn-clear" hidden>清除</button>
      </div>
    </section>

    <!-- 下载进度区 -->
    <section class="torrents-section">
      <div class="section-header">
        <h2 class="section-title">下载进度</h2>
        <button id="refreshTorrentsBtn" class="icon-btn" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
      <div id="torrentsList" class="torrents-list">
        <div class="torrents-empty">点击刷新获取 QBT 下载列表</div>
      </div>
    </section>

    <section class="sites-section">
      <h2 class="section-title">优质种子站点推荐</h2>
      <div id="sitesList" class="sites-list"></div>
    </section>
  </main>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>QBT 连接设置</h2>
        <button id="closeSettings" class="icon-btn" title="关闭" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="qbtHost">QBT 服务地址</label>
          <input type="text" id="qbtHost" placeholder="http://127.0.0.1:18580">
          <small class="hint">NAS 局域网 IP + QBT WebUI 端口，如 http://192.168.1.10:8080</small>
        </div>
        <div class="form-group">
          <label for="qbtUsername">登录用户名</label>
          <input type="text" id="qbtUsername" placeholder="QBT WebUI 账号">
        </div>
        <div class="form-group">
          <label for="qbtPassword">登录密码</label>
          <input type="password" id="qbtPassword" placeholder="QBT WebUI 密码">
        </div>
        <div class="form-group">
          <label for="savePath">默认保存路径（可选）</label>
          <input type="text" id="savePath" placeholder="留空则使用 QBT 默认路径">
        </div>
        <div class="form-group">
          <label for="downloadLimit">下载限速 KB/s（可选，0 为不限速）</label>
          <input type="number" id="downloadLimit" min="0" placeholder="0">
        </div>
      </div>
      <div class="modal-footer">
        <button id="testConnBtn" class="btn btn-secondary">测试连接</button>
        <button id="saveSettingsBtn" class="btn btn-primary">保存</button>
        <button id="cancelSettingsBtn" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>

  <!-- 删除确认弹窗 -->
  <div id="deleteModal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" data-delete-close></div>
    <div class="modal-content modal-sm">
      <div class="modal-header">
        <h2>删除任务</h2>
        <button id="closeDelete" class="icon-btn" title="关闭" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body">
        <p id="deleteName" class="delete-name"></p>
        <p class="hint">请选择删除方式：</p>
      </div>
      <div class="modal-footer">
        <button id="deleteTaskOnlyBtn" class="btn btn-secondary">仅删除任务</button>
        <button id="deleteWithFilesBtn" class="btn btn-danger">删除任务及文件</button>
        <button id="cancelDeleteBtn" class="btn btn-ghost">取消</button>
      </div>
    </div>
  </div>

  <!-- 右下角提示容器 -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="app.js?v=4"></script>
</body>
</html>
