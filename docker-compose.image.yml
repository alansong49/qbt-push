# =============================================================
# 纯镜像拉取版 compose —— 不包含任何构建指令
# 适用场景：NAS Docker GUI 直接粘贴此文件内容创建项目
# （GUI 工作目录里没有项目源码，绝不能出现 build: 段）
# =============================================================
services:
  qbt-push:
    # ---- 国内网络（DaoCloud 代理，推荐）----
    image: docker.m.daocloud.io/ghcr.io/alansong49/qbt-push:latest
    # ---- 海外网络或代理失败时，改用 GHCR 直连 ----
    # image: ghcr.io/alansong49/qbt-push:latest

    container_name: qbt-push
    restart: unless-stopped                         # 开机自启 + 异常自动重启
    ports:
      - "5000:5000"                                 # 左边端口可改，如 "8080:5000" 则用 8080 访问
    volumes:
      # 配置持久化：容器重启/更新/重建后 QBT 连接参数不丢失
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai                            # 容器时区
    logging:                                        # 日志轮转，防止占满 NAS 磁盘
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
