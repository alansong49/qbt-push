services:
  qbt-push:
    # 官方多架构镜像（amd64/arm64），NAS 直接拉取，无需构建
    # 默认走 Docker Hub 国内代理（最快，国内 NAS 秒拉）
    image: docker.1ms.run/jockersilas/qbt-push:latest
    # 备选：
    # image: docker.m.daocloud.io/jockersilas/qbt-push:latest
    # image: ghcr.io/alansong49/qbt-push:latest
    # 备选：本地构建模式（不联网拉镜像时使用）
    # 运行 sh install.sh --build 或手动:
    #   docker compose up -d --build
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-alpine}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: qbt-push
    restart: unless-stopped                         # 开机自启 + 异常自动重启
    ports:
      - "5000:5000"                                 # 左边端口可改，如 "8080:5000" 则用 8080 访问
    volumes:
      # 配置持久化：容器重启/更新/重建后 QBT 连接参数不丢失
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai                            # 容器时区
    logging:                                        # 日志轮转，防止占满 NAS 磁盘
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
